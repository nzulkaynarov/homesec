#!/usr/sbin/nft -f
# Inbound firewall of the HomeSec Raspberry Pi. Everything not listed is dropped.
# Installed to /etc/nftables.conf; see docs/05-operations.md.
flush ruleset

table inet homesec_fw {
  set lan {
    type ipv4_addr; flags interval
    elements = { 192.168.88.0/24 }
  }
  set clients {  # home LAN and the guest bridge; blocked devices are sent to the panel
    type ipv4_addr; flags interval
    elements = { 192.168.88.0/24, 192.168.90.0/24 }
  }

  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    meta l4proto { icmp, ipv6-icmp } accept
    udp dport 53 accept comment "AdGuard DNS for every device"
    tcp dport 53 accept
    ip saddr @lan tcp dport 22 accept comment "SSH, keys only"
    ip saddr @clients tcp dport 8000 accept comment "panel, block page, Luna API"
    ip saddr @lan tcp dport 3000 accept comment "AdGuard admin"
    udp sport 67 udp dport 68 accept comment "DHCP client"
  }
}
